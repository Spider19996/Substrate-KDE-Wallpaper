name: Release

# Pushing a tag like v1.0.0 attaches two files to the GitHub release of that tag:
#  - the source zip (tools/make-zip.sh), built by the user with ./install.sh
#  - the ready-to-install wallpaper package (tools/make-package.sh), x86_64, built against Qt 6.5; before it is
#    published, tests/package-smoke checks that it loads on Debian, Fedora and Arch
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pack the source zip
        run: ./tools/make-zip.sh

      - uses: actions/upload-artifact@v7
        with:
          name: source-zip
          path: dist/Substrate-KDE-Wallpaper-*.zip

  package:
    # An old system, so the plugin runs on any newer one (it needs the glibc it was built with or a newer one)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt 6.5, the oldest version the plugin is built for
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.*'
          cache: true

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgl1-mesa-dev libvulkan-dev libxkbcommon-dev

      - name: Build and pack the wallpaper package
        run: ./tools/make-package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: package-zip
          path: dist/Substrate-*-linux-*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: smoke-test
          path: tests/package-smoke

  # Does the finished package load on other distributions, with their Qt?
  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:trixie', 'debian:testing', 'fedora:latest', 'archlinux:latest']
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package-zip
          path: package

      - uses: actions/download-artifact@v8
        with:
          name: smoke-test
          path: smoke

      - name: Load the plugin of the package
        run: bash smoke/run.sh package/*.zip

  # One job creates the release and attaches both files. Two jobs creating the same release at the same
  # time can fail or leave a half-finished one.
  publish:
    needs: [source, package, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The notes come from a file: GitHub's "generate release notes" endpoint answered with 500 errors
      - name: Create the release and attach the files
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          body_path: .github/release-body.md
          fail_on_unmatched_files: true
