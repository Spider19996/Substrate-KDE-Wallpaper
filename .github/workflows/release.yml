name: Release

# Pushing a tag like v1.0.0 attaches the source zip (see tools/make-zip.sh) to the GitHub release of that tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack the zip
        run: ./tools/make-zip.sh

      - name: Attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
